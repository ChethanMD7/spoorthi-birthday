<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Spoorthi 🎂</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Poppins", system-ui, Arial, sans-serif;
    background: #000;
    overflow: hidden;
}

/* Cinematic background */
#bg {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: top center;
    filter: blur(14px) brightness(0.55);
    transform: scale(1.15);
    transition: background-image 1.2s ease;
    z-index: -2;
}
#overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, rgba(255,180,210,0.45), rgba(0,0,0,0.7));
    z-index: -1;
}

/* Stage */
#stage {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 10px;
}

/* Title */
h1 {
    color: #ff7fb8;
    margin-bottom: 12px;
}

/* Card */
#card {
    position: relative;
    width: min(90vw, 300px);
    height: min(70vh, 420px);
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 30px 90px rgba(0,0,0,0.65);
    opacity: 0;
    transform: translateY(60px) scale(0.96);
    transition: all 1s ease;
}
#card.show {
    opacity: 1;
    transform: translateY(0) scale(1);
}

#card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
}

/* Text plate */
#cardText {
    position: absolute;
    bottom: 0;
    width: 100%;
    padding: 18px 16px 22px;
    font-size: 1.05em;
    line-height: 1.45;
    color: #fff;
    text-align: center;
    background: linear-gradient(
        to top,
        rgba(0,0,0,0.85),
        rgba(255,95,162,0.55),
        rgba(255,95,162,0.15),
        transparent
    );
    min-height: 110px;
}

/* Floating elements */
.float {
    position: fixed;
    bottom: -40px;
    font-size: 22px;
    animation: floatUp 10s linear infinite;
    pointer-events: none;
}
@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-130vh); opacity: 0; }
}

/* Fireworks */
.firework {
    position: fixed;
    width: 6px;
    height: 6px;
    background: #ff8fc7;
    border-radius: 50%;
    animation: explode 1.6s ease-out forwards;
}
@keyframes explode {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(28); opacity: 0; }
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="overlay"></div>

<div id="stage">
    <h1>🎂 Happy Birthday Spoorthi 🎂</h1>

    <div id="card">
        <img id="cardImg">
        <div id="cardText"></div>
    </div>
</div>

<audio id="music" src="music.mp3"></audio>

<script>
const scenes = [
  { img: "photo1.jpg", text: "A moment that reflects your confidence and grace ✨" },
  { img: "photo2.jpg", text: "May life surprise you with calm, growth, and happiness 🌸" },
  { img: "photo3.jpg", text: "Wishing you joy in every little moment 🎉" },
  { img: "photo3.jpg", text: "— Best wishes always 💐" }
];

let index = 0;

/* Typing effect */
function typeText(el, text) {
    el.innerHTML = "";
    let i = 0;
    const t = setInterval(() => {
        el.innerHTML += text.charAt(i);
        i++;
        if (i >= text.length) clearInterval(t);
    }, 40);
}

/* Show scene */
function showScene(scene) {
    card.classList.remove("show");

    setTimeout(() => {
        cardImg.src = scene.img;
        bg.style.backgroundImage = `url('${scene.img}')`;
        typeText(cardText, scene.text);
        card.classList.add("show");
    }, 600);
}

/* Auto-play timeline */
function playStory() {
    if (index === 0) {
        music.play().catch(()=>{});
    }

    if (index < scenes.length) {
        showScene(scenes[index]);
        index++;
        setTimeout(playStory, 5200); // ⏳ time per scene
    } else {
        setTimeout(finale, 3000);
    }
}

/* Floating emojis */
const emojis = ["✨","🌸","🎉","🎂","🎀"];
setInterval(() => {
    const e = document.createElement("div");
    e.className = "float";
    e.innerText = emojis[Math.floor(Math.random()*emojis.length)];
    e.style.left = Math.random()*100 + "vw";
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),10000);
}, 600);

/* Finale fireworks */
function finale() {
    for (let w = 0; w < 4; w++) {
        setTimeout(() => {
            for (let i = 0; i < 45; i++) {
                const f = document.createElement("div");
                f.className = "firework";
                f.style.left = Math.random()*100 + "vw";
                f.style.top = Math.random()*100 + "vh";
                document.body.appendChild(f);
                setTimeout(()=>f.remove(),1600);
            }
        }, w * 700);
    }
}

/* Start automatically */
setTimeout(playStory, 1500);
</script>

</body>
</html>
